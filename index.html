<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-decorations">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <main class="game-container">
        <header class="game-header">
            <h1 class="title">Tic-Tac-Toe</h1>
            <div class="mode-selector">
                <button id="pvp-mode-btn" class="mode-btn active" data-mode="pvp">2 Players</button>
                <button id="ai-easy-btn" class="mode-btn" data-mode="ai-easy">AI (Easy)</button>
                <button id="ai-hard-btn" class="mode-btn" data-mode="ai-hard">AI (Hard)</button>
            </div>
        </header>

        <section class="scoreboard">
            <div class="score-card player-x-card active-turn" id="card-x">
                <span class="player-badge">X</span>
                <span class="player-name" id="name-x">Player 1</span>
                <span class="score" id="score-x">0</span>
            </div>
            <div class="score-card ties-card" id="card-ties">
                <span class="player-badge">-</span>
                <span class="player-name">Ties</span>
                <span class="score" id="score-ties">0</span>
            </div>
            <div class="score-card player-o-card" id="card-o">
                <span class="player-badge">O</span>
                <span class="player-name" id="name-o">Player 2</span>
                <span class="score" id="score-o">0</span>
            </div>
        </section>

        <div class="status-banner" id="status-banner" aria-live="polite">
            Player X's Turn
        </div>

        <section class="board-wrapper">
            <div class="board" id="board" role="grid" aria-label="Tic Tac Toe Board">
                <button class="cell" data-index="0" aria-label="Cell 1"></button>
                <button class="cell" data-index="1" aria-label="Cell 2"></button>
                <button class="cell" data-index="2" aria-label="Cell 3"></button>
                <button class="cell" data-index="3" aria-label="Cell 4"></button>
                <button class="cell" data-index="4" aria-label="Cell 5"></button>
                <button class="cell" data-index="5" aria-label="Cell 6"></button>
                <button class="cell" data-index="6" aria-label="Cell 7"></button>
                <button class="cell" data-index="7" aria-label="Cell 8"></button>
                <button class="cell" data-index="8" aria-label="Cell 9"></button>
            </div>
            <div class="winning-line" id="winning-line"></div>
        </section>

        <footer class="game-controls">
            <button id="restart-btn" class="action-btn primary-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                    <path d="M21 3v5h-5"></path>
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                    <path d="M8 16H3v5"></path>
                </svg>
                New Game
            </button>
            <button id="reset-scores-btn" class="action-btn secondary-btn">
                Reset Score
            </button>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
